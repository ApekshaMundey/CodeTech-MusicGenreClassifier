[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-genre-classifier"
version = "1.2.0"
description = "Four-source YAMNet and PANNs hybrid music genre classifier with a local web interface."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "tensorflow==2.20.0",
  "librosa>=0.10.2,<1.0",
  "numpy>=1.26,<2.2",
  "scikit-learn>=1.5,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "soundfile>=0.12,<1.0",
  "matplotlib>=3.9,<4.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
hybrid = [
  # tensorflow-hub 0.16.1 imports pkg_resources at runtime; setuptools 81 removed it.
  "setuptools>=69,<81",
  "tensorflow-hub==0.16.1",
  "torch>=2.6,<3.0",
  "torchlibrosa==0.1.0",
]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
